name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ThemeManager.slnx --locked-mode
      - run: dotnet build ThemeManager.slnx --configuration Release --no-restore
      - run: dotnet test ThemeManager.slnx --configuration Release --no-build
